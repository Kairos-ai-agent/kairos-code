name: kairos

on:
  push:
    branches: [main, develop, master]
  pull_request:
    branches: [main, develop, master]
  workflow_dispatch:
    inputs:
      task:
        description: "Task to run kairos on (default: code review)"
        required: false
        default: "review recent changes for security and correctness"

jobs:
  # -----------------------------------------------------------------
  # Auto-review: kairos exec on the diff between this PR and base.
  # -----------------------------------------------------------------
  review:
    name: kairos review
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install kairos
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run kairos review on PR diff
        if: github.event_name == 'pull_request'
        env:
          # API key should be stored as a repo secret. Any OpenAI-
          # compatible provider works (Kairos is provider-agnostic).
          KAIROS_API_KEY: ${{ secrets.KAIROS_API_KEY }}
        run: |
          BASE="${{ github.event.pull_request.base.sha }}"
          HEAD="${{ github.event.pull_request.head.sha }}"
          # Write a small diff file to a project work_dir.
          mkdir -p _ci_work
          cd _ci_work
          git init -q
          git config user.email "ci@localhost"
          git config user.name "CI"
          # The diff is in the parent checkout; we just point kairos
          # at it via the requirements field.
          python -m kairos exec \
            "Review the diff between $BASE and $HEAD for security, \
correctness, and style issues. Use git show $BASE..$HEAD to see \
the changes." \
            --work-dir . \
            --json \
            --timeout 600 \
            | tee kairos_review.json

      - name: Comment on PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '✅ kairos review: no CRITICAL issues found.';
            try {
              const data = JSON.parse(fs.readFileSync('_ci_work/kairos_review.json', 'utf8'));
              if (data.status === 'failed' || (data.result || '').includes('CRITICAL')) {
                body = '⚠️ kairos review flagged issues:\n\n```\n' +
                       (data.result || '').slice(0, 60000) + '\n```';
              } else if (data.status === 'completed') {
                body = '✅ kairos review passed:\n\n' +
                       (data.result || '').slice(0, 60000);
              }
            } catch (e) {
              body = '⚠️ kairos review produced no parseable output.';
            }
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

  # -----------------------------------------------------------------
  # Smoke test: run kairos --help and the unit tests on every push.
  # -----------------------------------------------------------------
  test:
    name: kairos tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e .
      - name: Run unit tests
        run: python -m pytest tests/ -x --timeout=60
