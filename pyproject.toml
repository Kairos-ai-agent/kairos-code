[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kairos-code"
version = "0.1.6"
description = "Self-hosted, model-agnostic multi-agent pipeline with enforced review gates and cost accounting"
readme = "README.md"
# SPDX (PEP 639). AGPL-3.0-or-later: anyone who runs a modified Kairos Code
# as a network service must offer the source.
license = "AGPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Kairos Code contributors" }]
keywords = [
    "ai-agents",
    "multi-agent",
    "code-review",
    "llm",
    "self-hosted",
    "agent-orchestration",
    "developer-tools",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Build Tools",
    "Typing :: Typed",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.50.0",
    "anthropic>=0.34.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
    # The settings store, the Feishu/IM bridges and api/routes/borrowed.py open
    # SQLite through aiosqlite. It used to be installed only by accident in
    # development, so a clean `pip install` could not even collect those tests.
    "aiosqlite>=0.20.0",
    # FastAPI refuses to register any Form(...)/file-upload route without it, and
    # that happens at import time — meaning the server died on startup from a
    # clean install. Found by the first release dry run, on all three platforms.
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
# Alternative model backends (the OpenAI/Anthropic-compatible path needs no extra).
ollama = ["ollama>=0.3.0"]
dashscope = ["dashscope>=1.20.0"]
zhipuai = ["zhipuai>=2.0.0"]
# Terminal UI (`kairos tui`). Optional: the Web UI and the CLI do not need it.
tui = ["textual>=0.80,<1.0"]
# /metrics endpoint + the Cogs dashboard counters.
metrics = ["prometheus-client>=0.20.0"]
# Native MCP stdio client and the bundled filesystem MCP server.
mcp = ["mcp>=1.0.0"]
# Pluggable integrations. Every one of these is imported lazily (inside the
# function that needs it), so the base install stays small and keeps working
# without them — declaring them here makes the feature installable and documents
# what it pulls in.
voice = ["edge-tts>=6.1", "faster-whisper>=1.0", "pyttsx3>=2.90"]
memory = ["cognee", "graphiti-core"]
browser = ["playwright>=1.40"]
cloud = ["boto3>=1.34"]
llm = ["litellm>=1.40"]
telemetry = ["opentelemetry-api>=1.20", "opentelemetry-sdk>=1.20"]
daemon = ["psutil>=5.9"]
# Everything needed to run the test suite the way CI does.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    # CI runs the suite with --timeout so a stuck test fails by name instead of
    # silently consuming the job's budget.
    "pytest-timeout>=2.3.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "textual>=0.80,<1.0",
    "prometheus-client>=0.20.0",
    "mcp>=1.0.0",
]
all = [
    "kairos-code[ollama,dashscope,zhipuai,tui,metrics,mcp,voice,memory,browser,cloud,llm,telemetry,daemon]",
]

[project.scripts]
# `pip install kairos-code` gives users a real `kairos` command. Bare `kairos`
# still starts the server (the CLI's documented default); the subcommands are
# serve / exec / gate / demo.
kairos = "kairos.cli:main"

[project.urls]
Homepage = "https://github.com/Kairos-ai-agent/kairos-code"
Repository = "https://github.com/Kairos-ai-agent/kairos-code"
Issues = "https://github.com/Kairos-ai-agent/kairos-code/issues"
Changelog = "https://github.com/Kairos-ai-agent/kairos-code/blob/master/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["kairos", "api"]

# Ship the built Web UI inside the wheel (api/app.py serves
# <site-packages>/web/dist) without breaking a plain `pip install` on a fresh
# clone. The mapping is conditional: `hatch_build.py` adds it only when
# web/dist has been built. A static force-include hard-fails with
# "Forced include not found: .../web/dist" otherwise — verified — and
# `artifacts = ["web/dist"]` silently adds nothing at all (0 entries in the
# built wheel).
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
