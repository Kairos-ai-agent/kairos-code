name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-latest
    # Every file in a shard is bounded individually by scripts/ci_shard.sh, and the
    # shard as a whole by the `timeout` in the step below, so this limit is only a
    # backstop. It used to be 90 minutes because a shard would hang and a job killed
    # by its own limit keeps no logs — the hang had to be allowed to finish for the
    # log to exist at all. Now the bound is inside the step, where the log survives.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "Run shard ${{ matrix.shard }} of 6"
        # One file at a time with a bound on each (scripts/ci_shard.sh). A module
        # that blocks during import or collection is invisible to pytest's
        # --timeout, and the resulting "a shard hung somewhere" was undiagnosable
        # because a cancelled job keeps no logs. The log now names every file it
        # ran, its duration, and the one that blocked; the outer timeout keeps the
        # whole step inside the job limit so that log survives either way.
        #
        # tests/test_updater.py checks the updater against the *real* published
        # release. Unauthenticated that API allows 60 requests an hour per IP, and
        # a hosted runner shares its IP with the world — so the suite went red with
        # a 403 the updater reports as "no assets", which reads like a product
        # defect and is not one. It happened in both the v0.1.4 and the v0.1.5
        # release windows. The default token raises the limit enough, and needs no
        # new secret.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: timeout 2400 bash scripts/ci_shard.sh ${{ matrix.shard }} 6

      - name: "Zero-key demo (the 60-second first run)"
        # Proves a fresh clone can show the whole gate/ledger story without any
        # API key and without network access. Runs once, not in all three shards.
        if: matrix.shard == 1
        run: python -m kairos demo --json --quiet

  frontend:
    name: Frontend tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

  i18n:
    name: i18n gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # check_i18n.mjs parses the TSX sources with the TypeScript compiler, which
      # it resolves out of web/node_modules — without this the gate dies with
      # "Cannot find module 'typescript'" instead of reporting a real finding.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: "Merge fragments (strict mode)"
        run: python scripts/merge_i18n.py --strict

      - name: "Check for hardcoded or missing strings"
        run: node scripts/check_i18n.mjs

  clean-install:
    name: Clean install (core dependencies only)
    # The gate that would have caught the first release's worst bug: the shipped
    # server died at import time because python-multipart was missing from the
    # core dependency set, and a developer venv has it installed anyway. Nothing
    # short of installing into an empty environment and starting the server sees
    # that, so this job does exactly that.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install into an empty environment, no extras
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install --quiet --upgrade pip
          /tmp/core/bin/pip install --quiet .

      - name: The installed CLI answers
        run: |
          /tmp/core/bin/kairos --version
          /tmp/core/bin/kairos demo --json --quiet

      - name: The installed server starts and serves the bundled UI
        run: |
          python scripts/smoke_binary.py --installed /tmp/core/bin/kairos \
            --port 9989 --timeout 120
