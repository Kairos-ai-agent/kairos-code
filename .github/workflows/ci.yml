name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Measured on a 2-vCPU runner: the fast shard (no subprocess-heavy files) takes
    # ~20s, while a shard holding the subprocess tests (the demo CLI spawns the
    # whole gate a dozen times, doctor probes a port per check) needs far longer
    # than the 35 minutes that used to be allowed — it was killed mid-run and a
    # cancelled job keeps no logs, so there was nothing to diagnose with. 75
    # minutes is deliberately generous; --durations=25 names the slow tests.
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "Run shard ${{ matrix.shard }} of 3"
        # --timeout names a genuinely stuck test instead of letting it eat the
        # job budget; --durations keeps the slow ones visible in the log.
        #
        # The diagnostics block matters: when pytest dies during collection it
        # exits 2 and the log says nothing else useful, which is exactly how two
        # shards failed once with no explanation. Re-running collection prints
        # the import errors.
        run: |
          FILES=$(python scripts/split_tests.py --shard ${{ matrix.shard }} --shards 3)
          echo "files in shard ${{ matrix.shard }}: $(echo "$FILES" | wc -w)"
          set +e
          pytest $FILES -q --timeout=180 --durations=25
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            echo "::group::diagnostics — collection (pytest exited $rc)"
            pytest $FILES --collect-only -q -p no:cacheprovider 2>&1 | tail -60
            echo "::endgroup::"
          fi
          exit "$rc"

      - name: "Zero-key demo (the 60-second first run)"
        # Proves a fresh clone can show the whole gate/ledger story without any
        # API key and without network access. Runs once, not in all three shards.
        if: matrix.shard == 1
        run: python -m kairos demo --json --quiet

  frontend:
    name: Frontend tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

  i18n:
    name: i18n gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # check_i18n.mjs parses the TSX sources with the TypeScript compiler, which
      # it resolves out of web/node_modules — without this the gate dies with
      # "Cannot find module 'typescript'" instead of reporting a real finding.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: "Merge fragments (strict mode)"
        run: python scripts/merge_i18n.py --strict

      - name: "Check for hardcoded or missing strings"
        run: node scripts/check_i18n.mjs

  clean-install:
    name: Clean install (core dependencies only)
    # The gate that would have caught the first release's worst bug: the shipped
    # server died at import time because python-multipart was missing from the
    # core dependency set, and a developer venv has it installed anyway. Nothing
    # short of installing into an empty environment and starting the server sees
    # that, so this job does exactly that.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build the Web UI
        working-directory: web
        run: |
          npm ci
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install into an empty environment, no extras
        run: |
          python -m venv /tmp/core
          /tmp/core/bin/pip install --quiet --upgrade pip
          /tmp/core/bin/pip install --quiet .

      - name: The installed CLI answers
        run: |
          /tmp/core/bin/kairos --version
          /tmp/core/bin/kairos demo --json --quiet

      - name: The installed server starts and serves the bundled UI
        run: |
          python scripts/smoke_binary.py --installed /tmp/core/bin/kairos \
            --port 9989 --timeout 120
