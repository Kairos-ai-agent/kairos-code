name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    # Measured: the full suite is ~3 min on a many-core dev box but 20-25 min on
    # a 2-vCPU runner, because a large share of the 1843 tests spawn subprocesses
    # (the demo CLI tests alone run the whole gate 10+ times). 25 minutes was not
    # enough and the job was killed mid-suite. Raising the ceiling is the honest
    # fix; sharding the suite is the next step if it keeps growing.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Test suite
        run: pytest tests -q

      - name: "Zero-key demo (the 60-second first run)"
        # Proves a fresh clone can show the whole gate/ledger story without any
        # API key and without network access.
        run: python -m kairos demo --json --quiet

  frontend:
    name: Frontend tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

  i18n:
    name: i18n gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # check_i18n.mjs parses the TSX sources with the TypeScript compiler, which
      # it resolves out of web/node_modules — without this the gate dies with
      # "Cannot find module 'typescript'" instead of reporting a real finding.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: "Merge fragments (strict mode)"
        run: python scripts/merge_i18n.py --strict

      - name: "Check for hardcoded or missing strings"
        run: node scripts/check_i18n.mjs
