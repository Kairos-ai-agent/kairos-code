name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    # Measured: the full suite is ~3 min on a many-core dev box but 40+ on a
    # 2-vCPU runner, because a large share of the 1867 tests spawn subprocesses
    # (the demo CLI tests alone run the whole gate a dozen times). One job either
    # burns the whole timeout or gets killed mid-suite, so the suite is split
    # into three balanced shards (see scripts/split_tests.py --verify: every
    # module exactly once, 1.00x balance).
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "Run shard ${{ matrix.shard }} of 3"
        # --timeout names a genuinely stuck test instead of letting it eat the
        # job budget; --durations keeps the slow ones visible in the log.
        run: |
          FILES=$(python scripts/split_tests.py --shard ${{ matrix.shard }} --shards 3)
          pytest $FILES -q --timeout=300 --durations=10

      - name: "Zero-key demo (the 60-second first run)"
        # Proves a fresh clone can show the whole gate/ledger story without any
        # API key and without network access. Runs once, not in all three shards.
        if: matrix.shard == 1
        run: python -m kairos demo --json --quiet

  frontend:
    name: Frontend tests and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx vitest run

  i18n:
    name: i18n gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      # check_i18n.mjs parses the TSX sources with the TypeScript compiler, which
      # it resolves out of web/node_modules — without this the gate dies with
      # "Cannot find module 'typescript'" instead of reporting a real finding.
      - name: Install web dependencies
        working-directory: web
        run: npm ci

      - name: "Merge fragments (strict mode)"
        run: python scripts/merge_i18n.py --strict

      - name: "Check for hardcoded or missing strings"
        run: node scripts/check_i18n.mjs
